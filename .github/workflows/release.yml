name: Release to PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Needed for trusted publishing
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # synth-010 publish guard: never ship a release that depends on the unreleased local
      # allora-sdk worktree. [tool.uv.sources] redirects allora-sdk to ../allora-sdk-py (editable),
      # which is invisible to PyPI consumers, so its presence must hard-fail the publish. Also
      # verify the declared allora-sdk requirement actually resolves from PyPI so a pin bumped
      # ahead of the SDK's PyPI release (ENGN-8646) cannot ship a broken dependency.
      - name: Guard against unreleased local SDK source
        run: |
          set -euo pipefail
          # Parse the TOML rather than grep for a header: a grep anchored on "[tool.uv.sources"
          # misses semantically equivalent forms (inline "[tool.uv]" with a "sources = {...}" key,
          # dotted/quoted keys, etc.) that would still redirect allora-sdk to the local worktree.
          if python -c "import tomllib, sys; data = tomllib.load(open('pyproject.toml', 'rb')); sys.exit(0 if 'sources' in data.get('tool', {}).get('uv', {}) else 1)"; then
            echo "::error file=pyproject.toml::[tool.uv.sources] is still present; it pins allora-sdk to the local ../allora-sdk-py worktree and must be removed before publishing (gated on the allora-sdk PyPI release, ENGN-8646)."
            exit 1
          fi
          req="$(python -c "import tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print(next(r for r in deps if r.replace(' ', '').lower().startswith('allora-sdk')))")"
          echo "Verifying '${req}' is resolvable from PyPI (wheels only)..."
          # Resolve wheels only (--only-binary=:all:): never build an sdist, so this check cannot
          # execute arbitrary build hooks from a source distribution in a job that holds
          # id-token: write. allora-sdk publishes a wheel for every release.
          python -m pip download --no-deps --only-binary=:all: --dest /tmp/allora-sdk-resolve "${req}"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
